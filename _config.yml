# Site-wide settings. If you change this file, GitHub may take a
# couple of minutes longer than usual to rebuild the site.

title: Kevin Ferguson
tagline: Highways · Data · AI
description: >-
  Road and street works systems, national data standards, and applied AI
  in the public sector. Projects, writing and open source by Kevin Ferguson.
