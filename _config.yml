# Site-wide settings. If you change this file, GitHub may take a
# couple of minutes longer than usual to rebuild the site.

title: Kevin Ferguson
tagline: Highways · Data · AI
description: >-
  Road and street works systems, national data standards, and applied AI
  in the public sector. Projects, writing and open source by Kevin Ferguson.
url: "https://kfergusonuk.github.io"

theme: minima
# Note: minima's "skin" option needs minima 3.x, which GitHub Pages does
# not support. Styling overrides live in assets/main.scss instead — that
# path shadows minima's own bundled stylesheet, which is what
# <link rel="stylesheet" href="/assets/main.css"> actually loads.

# These appear in the top nav bar, in this order.
header_pages:
  - about.md
  - projects.md
  - articles.md
  - awards.md

# Footer / social links
github_username: KFergusonUK

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
